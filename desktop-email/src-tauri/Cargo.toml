[package]
name = "desktop-email"
version = "0.1.0"
description = "邮件解析桌面应用"
authors = ["Email Parser"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = [] }
rfd = { version = "0.16", default-features = false }
log = "0.4"
tauri-plugin-log = "2"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
