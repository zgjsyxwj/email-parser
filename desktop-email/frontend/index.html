<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>邮件解析</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <dialog id="preview" class="preview" aria-labelledby="preview-title">
      <header class="preview-header"><h2 id="preview-title">原邮件预览</h2><button data-action="close-preview" autofocus>关闭</button></header>
      <div id="preview-content" class="preview-content" aria-live="polite"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
